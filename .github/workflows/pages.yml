name: Publicar Kodeo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gerar o site estático
        run: |
          pnpm build
          test -s out/index.html
          test -s out/licoes/ciberseguranca/index.html
          touch out/.nojekyll
        env:
          KODEO_STATIC_EXPORT: '1'
          KODEO_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment


  verify-cyber:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KODEO_E2E_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Aguardar atualização da rota pública
        run: |
          url="${KODEO_E2E_URL%/}/licoes/ciberseguranca/"
          for attempt in {1..15}; do
            if curl --fail --silent --show-error --location --max-time 10 "$url" -o "$RUNNER_TEMP/cyber.html" && grep -Fq 'Desafios de cibersegurança' "$RUNNER_TEMP/cyber.html"; then
              exit 0
            fi
            sleep 8
          done
          echo "::error::A rota pública de Cyber ainda não disponibiliza a lição."
          exit 1
      - name: Responder, corrigir e retomar Cyber no site público
        run: pnpm test:e2e tests/e2e/security-quiz.spec.ts
